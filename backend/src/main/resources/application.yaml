spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://db.pplsjoawhuwduumvrjxf.supabase.co:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-before-production}
    expiration-minutes: 120
